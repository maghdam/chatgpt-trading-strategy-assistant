openapi: 3.1.0
info:
  title: Ctrader OpenApi Market Data
  version: 1.1.2
servers:
  - url: https://chatgpt-trading-strategy-assistant.onrender.com

paths:
  /fetch-data:
    post:
      operationId: fetchMarketData
      summary: Fetch OHLC market data and optionally return a chart image
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - symbol
              properties:
                symbol:
                  type: string
                  description: Broker-specific symbol name (e.g., "EURUSD", "EURUSD.a")
                timeframe:
                  type: string
                  default: M5
                  description: Timeframe (e.g., M1, M5, H1, H4, D1)
                num_bars:
                  type: integer
                  default: 500
                return_chart:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Market data with optional chart image
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  timeframe:
                    type: string
                  ohlc:
                    type: array
                    items:
                      type: object
                      properties:
                        time:
                          type: string
                        open:
                          type: number
                        high:
                          type: number
                        low:
                          type: number
                        close:
                          type: number
                        volume:
                          type: number
                  context:
                    type: object
                  trend:
                    type: object
                  chart_image_base64:
                    type: string
                    nullable: true
        "404":
          description: Symbol or timeframe not found

  /journal-entry:
    post:
      operationId: postJournalEntry
      summary: Create a journal entry in Notion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - symbol
                - session
                - htf_bias
                - entry_type
                - entry_price
                - stop_loss
                - target_price
                - order_type
              properties:
                title:
                  type: string
                symbol:
                  type: string
                session:
                  type: string
                htf_bias:
                  type: string
                entry_type:
                  type: string
                entry_price:
                  type: number
                stop_loss:
                  type: number
                target_price:
                  type: number
                order_type:
                  type: string
                status:
                  type: string
                note:
                  type: string
                  nullable: true
                checklist:
                  type: string
                  nullable: true
                news_events:
                  type: string
                  nullable: true
                chart_url:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Journal entry created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /open-positions:
    get:
      operationId: getOpenPositions
      summary: Retrieve currently open positions from cTrader
      responses:
        "200":
          description: List of open positions
          content:
            application/json:
              schema:
                type: object
                properties:
                  positions:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol_name:
                          type: string
                        position_id:
                          type: integer
                        direction:
                          type: string
                        entry_price:
                          type: number
                        stop_loss:
                          type: number
                          nullable: true
                        take_profit:
                          type: number
                          nullable: true
                        volume_lots:
                          type: number
                        volume_units:
                          type: integer
                        unrealized_profit:
                          type: number
                          nullable: true
                        timestamp_utc:
                          type: string
                          nullable: true
                        timestamp_local:
                          type: string
                          nullable: true
        "500":
          description: Failed to retrieve open positions

  /place-order:
    post:
      operationId: placeOrder
      summary: Execute a trade order on cTrader
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - symbol
                - order_type
                - direction
                - volume
              properties:
                symbol:
                  type: string
                order_type:
                  type: string
                  enum: [MARKET, LIMIT, STOP]
                direction:
                  type: string
                  enum: [BUY, SELL]
                volume:
                  type: number
                  description: Position size in lots (for example 1.0). Large integer values are also accepted as native cTrader units for backward compatibility.
                entry_price:
                  type: number
                stop_loss:
                  type: number
                take_profit:
                  type: number
      responses:
        "200":
          description: Trade executed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  order_id:
                    type: integer
        "400":
          description: Invalid order parameters
        "500":
          description: Server error during order execution

  /tag-sessions:
    post:
      operationId: tagSessions
      summary: Add session labels to OHLC candles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - candles
              properties:
                candles:
                  type: array
                  items:
                    type: object
                    required: [time, open, high, low, close, volume]
                    properties:
                      time:
                        type: string
                        format: date-time
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
                      volume:
                        type: integer
      responses:
        "200":
          description: Session-labeled OHLC candles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    time:
                      type: string
                      format: date-time
                    open:
                      type: number
                    high:
                      type: number
                    low:
                      type: number
                    close:
                      type: number
                    volume:
                      type: integer
                    session:
                      type: string
                      enum: [Asia, London, NewYork, PostNY, Unknown]

  /pending-orders:
    get:
      operationId: getPendingOrders
      summary: Retrieve currently pending limit/stop orders from cTrader
      responses:
        "200":
          description: List of pending orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        order_id:
                          type: integer
                        symbol_id:
                          type: integer
                        symbol_name:
                          type: string
                        direction:
                          type: string
                          enum: [buy, sell]
                        order_type:
                          type: string
                          enum: [LIMIT, STOP]
                        entry_price:
                          type: number
                          nullable: true
                        stop_loss:
                          type: number
                          nullable: true
                        take_profit:
                          type: number
                          nullable: true
                        volume:
                          type: number
                        creation_time:
                          type: string
        "500":
          description: Failed to retrieve pending orders

  /session-levels:
    post:
      operationId: getSessionLevels
      summary: Get session highs and lows from OHLC data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                candles:
                  type: array
                  items:
                    type: object
                    required: [time, open, high, low, close, volume, session]
                    properties:
                      time:
                        type: string
                        format: date-time
                      open:
                        type: number
                      high:
                        type: number
                      low:
                        type: number
                      close:
                        type: number
                      volume:
                        type: integer
                      session:
                        type: string
                        enum: [Asia, London, NewYork, PostNY, Unknown]
      responses:
        "200":
          description: Session-level highs and lows
          content:
            application/json:
              schema:
                type: object
                properties:
                  Asia:
                    type: object
                    properties:
                      high:
                        type: number
                      low:
                        type: number
                  London:
                    type: object
                    properties:
                      high:
                        type: number
                      low:
                        type: number
                  NewYork:
                    type: object
                    properties:
                      high:
                        type: number
                      low:
                        type: number
                  PostNY:
                    type: object
                    properties:
                      high:
                        type: number
                      low:
                        type: number
        "500":
          description: Error processing session levels

  /analyze:
    post:
      operationId: analyze
      summary: Run full Smart Money Concepts (SMC) analysis on a symbol
      description: >
        Returns full multi-timeframe SMC analysis (HTF, MTF, LTF) from the user's cTrader backend.
        ⚠️ Provides only technical data. Fundamentals must be fetched separately from web sources (e.g., Yahoo Finance).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - symbol
              properties:
                symbol:
                  type: string
                  description: Symbol to analyze (e.g., "EURUSD", "XAUUSD", "AAPL.US")
      responses:
        "200":
          description: Technical market structure analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  HTF_Bias:
                    type: string
                    description: Macro trend direction from D1 timeframe
                  MTF_Zones:
                    type: object
                    description: Multi-timeframe order blocks, BOS signals, and fair value gaps
                  LTF_Entry:
                    type: object
                    description: Low timeframe entry details (M15/M5)
                  Previous_Day_High:
                    type: number
                  Previous_Day_Low:
                    type: number
                  Session_Levels:
                    type: object
                    description: Session highs and lows (Asia, London, NY, PostNY)
                  Checklist:
                    type: object
                    description: Full technical checklist (CHOCH, BOS, OB, FVG, Sweep, Candle)
                  Confluence:
                    type: object
                    description: Weighted confluence result used to decide whether a setup qualifies
                    properties:
                      direction:
                        type: string
                        description: Bullish, bearish, or neutral setup direction
                      score:
                        type: integer
                      threshold:
                        type: integer
                      eligible:
                        type: boolean
                      components:
                        type: object
                        description: Weighted component map showing which signals contributed
                      present_components:
                        type: array
                        items:
                          type: string
                      summary:
                        type: string
                      htf_bias_aligned:
                        type: boolean
                  News:
                    type: string
                    nullable: true
                    description: Market news summary (if available)
                  Fundamentals:
                    type: object
                    nullable: true
                    description: >
                      Placeholder for fundamental data — fetched by ChatGPT from web sources after technical analysis.
                    properties:
                      company_name:
                        type: string
                      market_cap:
                        type: string
                      pe_ratio:
                        type: number
                      eps:
                        type: number
                      pb_ratio:
                        type: number
                      ps_ratio:
                        type: number
                      roe:
                        type: number
                      roa:
                        type: number
                      sentiment:
                        type: string
                        description: "Bullish, Neutral, or Bearish sentiment"

  /fundamental-data:
    post:
      deprecated: true
      operationId: fetchFundamentalData
      summary: (Deprecated) Fetch fundamental metrics for a stock
      description: >
        ⚠️ Deprecated endpoint. Do not call this API. 
        Fundamentals must be fetched from web sources 
        (e.g., Yahoo Finance, MarketWatch, TradingView, FMP, Finviz).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - symbol
              properties:
                symbol:
                  type: string
                  description: Stock symbol (e.g., "AAPL.US", "AMD.US", "TSLA.US")
      responses:
        "410":
          description: Deprecated endpoint — do not use.
